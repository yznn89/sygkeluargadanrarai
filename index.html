<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yzeen Profile</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* BACKGROUND */

html{
scroll-behavior:smooth;
}

body{
margin:0;
font-family:Arial;
color:white;
text-align:center;
background:linear-gradient(-45deg,#020202,#001a1f,#000f13,#020202);
background-size:400% 400%;
animation:bgmove 15s ease infinite;
}

@keyframes bgmove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* STARS */

.stars{
position:fixed;
width:100%;
height:100%;
z-index:-1;
}

.star{
position:absolute;
width:2px;
height:2px;
background:white;
border-radius:50%;
animation:twinkle 4s cubic-bezier(0.4, 0.0, 0.6, 1.0) infinite;
box-shadow:0 0 4px rgba(255,255,255,0.8);
}

.star:nth-child(1){top:10%;left:20%;animation-delay:0s;}
.star:nth-child(2){top:30%;left:70%;animation-delay:0.5s;}
.star:nth-child(3){top:60%;left:40%;animation-delay:1s;}
.star:nth-child(4){top:80%;left:80%;animation-delay:1.5s;}
.star:nth-child(5){top:50%;left:10%;animation-delay:2s;}
.star:nth-child(6){top:20%;left:50%;animation-delay:2.5s;}
.star:nth-child(7){top:75%;left:30%;animation-delay:3s;}
.star:nth-child(8){top:40%;left:85%;animation-delay:3.5s;}

@keyframes twinkle{
0%{opacity:0.3; transform:scale(1)}
50%{opacity:1; transform:scale(1.2)}
100%{opacity:0.3; transform:scale(1)}
}

/* SUPER SMOOTH INTRO */

.profile,
.stats,
.links,
.spotify-card,
.footer{
opacity:0;
transform:translateY(50px) scale(0.95);
filter:blur(12px);
animation:smoothReveal 2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

.stats{animation-delay:.4s;}
.links{animation-delay:.8s;}
.spotify-card{animation-delay:1.2s;}
.footer{animation-delay:1.6s;}

@keyframes smoothReveal{
0%{
opacity:0;
transform:translateY(50px) scale(0.95);
filter:blur(12px);
}

100%{
opacity:1;
transform:translateY(0) scale(1);
filter:blur(0);
}
}

/* PROFILE */

.profile{
margin-top:90px;
}

.profile img{
width:130px;
height:130px;
border-radius:50%;
border:3px solid #888888;
box-shadow:0 0 40px rgba(136,136,136,0.5), 0 0 60px rgba(29,185,84,0.2);
animation:float 8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
transition:all 0.4s ease;
position:relative;
}

.profile img:hover{
border-color:#1db954;
box-shadow:0 0 50px rgba(29,185,84,0.6), 0 0 80px rgba(29,185,84,0.3);
transform:scale(1.05);
}

@keyframes float{
0%{transform:translateY(0px)}
50%{transform:translateY(-15px)}
100%{transform:translateY(0px)}
}

.name{
font-size:32px;
margin-top:10px;
font-weight:bold;
letter-spacing:1px;
transition:all 0.3s ease;
}

.name:hover{
color:#1db954;
text-shadow:0 0 20px rgba(29,185,84,0.5);
}

.verify{
color:#888888;
font-size:20px;
margin-left:6px;
transition:all 0.3s ease;
animation:pulse-verify 2s ease-in-out infinite;
}

.name:hover .verify{
color:#1db954;
text-shadow:0 0 15px rgba(29,185,84,0.6);
}

@keyframes pulse-verify{
0%, 100%{opacity:0.7; transform:scale(1)}
50%{opacity:1; transform:scale(1.1)}
}

/* RUNNING TEXT */

.bio{
margin-top:12px;
color:white;
font-size:16px;
letter-spacing:1px;
font-weight:400;
position:relative;
height:28px;
display:flex;
align-items:center;
justify-content:center;
}

.bio span{
display:inline-block;
animation:floatText 3s ease-in-out infinite;
}

@keyframes floatText{
0%{transform:translateY(0px)}
50%{transform:translateY(-8px)}
100%{transform:translateY(0px)}
}

/* STATS */

.stats{
display:flex;
justify-content:center;
gap:40px;
margin-top:22px;
}

.stat{
position:relative;
padding:15px 20px;
border-radius:12px;
transition:all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
cursor:pointer;
text-decoration:none;
color:inherit;
display:block;
}

.stat:hover{
background:rgba(136,136,136,0.05);
transform:translateY(-4px);
}

.stat h3{
color:#888888;
margin:0;
font-size:28px;
font-weight:bold;
transition:color 0.3s ease;
}

.stat:hover h3{
color:#1db954;
text-shadow:0 0 15px rgba(29,185,84,0.5);
}

.stat p{
margin:6px 0 0 0;
font-size:12px;
color:#aaa;
letter-spacing:1px;
transition:color 0.3s ease;
}

.stat:hover p{
color:#888888;
}

/* BUTTONS */

.links{
display:grid;
grid-template-columns:repeat(3,140px);
gap:12px;
justify-content:center;
margin-top:28px;
}

.btn{
padding:13px;
border-radius:14px;
border:1px solid #222;
background:#0c0c0c;
color:white;
text-decoration:none;
display:flex;
align-items:center;
justify-content:center;
gap:8px;
cursor:pointer;
transition:all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
position:relative;
overflow:hidden;
}

.btn::before{
content:'';
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;
background:linear-gradient(90deg, transparent, rgba(136,136,136,0.2), transparent);
transition:left 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.btn:hover::before{
left:100%;
}

.btn:hover{
border-color:#888888;
box-shadow:0 0 25px rgba(136,136,136,0.4), inset 0 0 15px rgba(136,136,136,0.1);
transform:translateY(-6px) scale(1.05);
background:#1a1a1a;
}

@media(max-width:500px){
.links{
grid-template-columns:repeat(2,120px);
gap:10px;
}

.btn{
padding:10px;
font-size:12px;
}
}

/* SPOTIFY CARD */

.spotify-card{
width:350px;
margin:42px auto;
background:#0f0f0f;
border-radius:16px;
padding:14px;
border:1px solid #1a1a1a;
box-shadow:0 0 25px rgba(136,136,136,0.15), 0 0 40px rgba(29,185,84,0.1);
transition:all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
position:relative;
overflow:hidden;
}

.spotify-card::before{
content:'';
position:absolute;
top:-50%;
left:-50%;
width:200%;
height:200%;
background:radial-gradient(circle, rgba(29,185,84,0.1) 0%, transparent 70%);
opacity:0;
transition:opacity 0.5s ease;
pointer-events:none;
}

.spotify-card:hover::before{
opacity:1;
}

.spotify-card:hover{
transform:translateY(-12px) scale(1.03);
box-shadow:0 0 40px rgba(136,136,136,0.3), 0 0 60px rgba(29,185,84,0.2);
border-color:#1db954;
}

.spotify-header{
display:flex;
align-items:center;
gap:8px;
margin-bottom:10px;
font-size:14px;
color:#1db954;
}

.spotify-card iframe{
border-radius:10px;
}

/* PAYMENT POPUP */

.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:flex;
align-items:center;
justify-content:center;
opacity:0;
pointer-events:none;
transition:opacity 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), backdrop-filter 0.4s ease;
backdrop-filter:blur(0px);
}

.popup.show{
opacity:1;
pointer-events:auto;
backdrop-filter:blur(8px);
}

.popup-box{
background:#0f0f0f;
width:320px;
border-radius:18px;
padding:20px;
border:1px solid #888888;
box-shadow:0 20px 60px rgba(0,0,0,0.5), 0 0 30px rgba(136,136,136,0.3);
transform:scale(0.85) translateY(50px);
transition:all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
opacity:0;
}

.popup.show .popup-box{
transform:scale(1) translateY(0);
opacity:1;
}

.qr{
width:180px;
margin:12px auto;
display:block;
border-radius:10px;
}

.pay{
background:#111;
margin-top:10px;
padding:10px;
border-radius:10px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.pay img{
width:40px;
height:40px;
object-fit:contain;
}

.copybtn{
background:#888888;
border:none;
padding:6px 12px;
border-radius:6px;
cursor:pointer;
color:white;
transition:all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
font-weight:500;
font-size:12px;
position:relative;
overflow:hidden;
}

.copybtn::before{
content:'';
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;
background:rgba(255,255,255,0.2);
transition:left 0.4s;
}

.copybtn:hover::before{
left:100%;
}

.copybtn:hover{
background:#1db954;
transform:translateY(-2px) scale(1.08);
box-shadow:0 6px 16px rgba(29,185,84,0.4);
}

.close{
margin-top:15px;
padding:8px 15px;
border:none;
border-radius:8px;
background:#222;
color:white;
cursor:pointer;
}

/* TOAST NOTIFICATION */

.toast-container{
position:fixed;
top:20px;
right:20px;
z-index:9999;
display:flex;
flex-direction:column;
gap:10px;
}

.toast{
background:#1a1a1a;
border:1px solid #888888;
border-radius:12px;
padding:14px 18px;
color:white;
display:flex;
align-items:center;
gap:10px;
box-shadow:0 8px 32px rgba(0,0,0,0.3), 0 0 20px rgba(136,136,136,0.2);
animation:slideIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
min-width:280px;
backdrop-filter:blur(10px);
}

.toast.success{
border-color:#1db954;
background:rgba(29,185,84,0.1);
}

.toast.error{
border-color:#ff6b6b;
background:rgba(255,107,107,0.1);
}

.toast-icon{
font-size:18px;
}

.toast.success .toast-icon{
color:#1db954;
}

.toast.error .toast-icon{
color:#ff6b6b;
}

.toast-text{
flex:1;
font-size:14px;
font-weight:500;
}

.toast-close{
background:none;
border:none;
color:#888888;
cursor:pointer;
font-size:16px;
padding:0;
transition:.2s;
}

.toast-close:hover{
color:white;
}

@keyframes slideIn{
0%{
transform:translateX(400px) scale(0.9);
opacity:0;
}
100%{
transform:translateX(0) scale(1);
opacity:1;
}
}

@keyframes slideOut{
0%{
transform:translateX(0) scale(1);
opacity:1;
}
100%{
transform:translateX(400px) scale(0.9);
opacity:0;
}
}

@media(max-width:500px){
.links{
grid-template-columns:repeat(2,120px);
gap:10px;
}

.btn{
padding:10px;
font-size:12px;
}

.toast-container{
right:10px;
left:10px;
}

.toast{
min-width:auto;
}
}

.footer{
margin-top:40px;
padding:30px 20px;
}

.footer p{
margin:8px 0;
font-size:12px;
color:#888888;
transition:all 0.3s ease;
letter-spacing:0.5px;
}

.footer p:hover{
color:#1db954;
text-shadow:0 0 15px rgba(29,185,84,0.4);
}

</style>
</head>

<script>

// ANIMATED COUNTER
function animateCounter(element, target, duration = 2000) {
const start = 0;
const increment = target / (duration / 16); // 60fps
let current = start;

const counter = setInterval(() => {
current += increment;

if (current >= target) {
element.textContent = target;
clearInterval(counter);
} else {
element.textContent = Math.floor(current);
}
}, 16);
}

// Trigger animation saat page load
window.addEventListener('load', () => {
const followerCounter = document.getElementById('followerCount');
const likesCounter = document.getElementById('likesCount');

animateCounter(followerCounter, 200, 2500); // 2.5 detik
animateCounter(likesCounter, 500, 2800); // 2.8 detik (sedikit delay)
});

function openPayment(){
document.getElementById("paymentPopup").classList.add("show");
}

function closePayment(){
document.getElementById("paymentPopup").classList.remove("show");
}

function showToast(message, type='success'){
const container=document.getElementById("toastContainer");

const toast=document.createElement("div");
toast.className=`toast ${type}`;

const iconClass=type==='success'?'fa-check-circle':'fa-exclamation-circle';

toast.innerHTML=`
<i class="fa-solid ${iconClass} toast-icon"></i>
<span class="toast-text">${message}</span>
<button class="toast-close" onclick="this.parentElement.remove()">
<i class="fa-solid fa-times"></i>
</button>
`;

container.appendChild(toast);

setTimeout(()=>{
toast.style.animation="slideOut .4s cubic-bezier(.19,1,.22,1) forwards";
setTimeout(()=>toast.remove(),400);
},2500);
}

function copyText(id){
let text=document.getElementById(id).innerText;

if(navigator.clipboard&&window.isSecureContext){
navigator.clipboard.writeText(text).then(()=>{
showToast(`Copied: ${text}`,  'success');
}).catch(()=>{
fallbackCopy(text);
});
}else{
fallbackCopy(text);
}
}

function fallbackCopy(text){
const textarea=document.createElement("textarea");
textarea.value=text;
textarea.style.position="fixed";
textarea.style.opacity="0";
document.body.appendChild(textarea);
textarea.select();
try{
document.execCommand("copy");
showToast(`Copied: ${text}`,  'success');
}catch(err){
showToast('Failed to copy',  'error');
}
document.body.removeChild(textarea);
}

</script>
